<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Monica Memorial School | Beyond Learning | Mwihoko - Wendani</title>
    <link rel="icon" href="images/stmonica_logo.jpg" type="image/x-icon">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#142752',
                            900: '#0F2962',
                            950: '#0A1C44',
                        },
                        academicRed: {
                            500: '#EF233C',
                            600: '#E31B23',
                            700: '#C1121F',
                        },
                        softGray: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-brand {
            background: linear-gradient(135deg, #0F2962 0%, #1B365D 50%, #0A1C44 100%);
        }
        .gradient-red {
            background: linear-gradient(135deg, #E31B23 0%, #C1121F 100%);
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(227, 27, 35, 0.4);
        }
        .shield-clip {
            clip-path: polygon(0% 0%, 100% 0%, 100% 85%, 50% 100%, 0% 85%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #0F2962;
            border-radius: 4px;
        }
    </style>
</head>
<body class="font-sans text-slate-800 bg-slate-50 antialiased selection:bg-academicRed-600 selection:text-white flex flex-col min-h-screen custom-scrollbar">

    <!-- Header / Navigation -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-slate-100 transition-all duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Brand Logo & Badge -->
                <a href="#" class="flex items-center gap-3 group">
                    <div class="relative w-12 h-14 bg-white flex flex-col items-center justify-between p-1 shadow-md group-hover:scale-105 transition-transform duration-300">
                        <!-- Red/Blue Grid Mini Crest -->
                        
                        <div class="text-[10px] text-navy-900 font-bold leading-none py-0.5">
                            <img src="images/stmonica_logo.jpg" alt="" srcset="">
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-serif text-lg md:text-xl font-bold text-navy-900 leading-tight">St. Monica <span class="text-academicRed-600">Memorial</span></span>
                        <span class="text-xs font-semibold tracking-wider text-slate-500 uppercase">School • Beyond Learning</span>
                    </div>
                </a>

            </div>
        </div>

          
        </div>
    </header>

    <main class="flex-grow">
        <!-- Hero Section -->
        <section id="home" class="relative gradient-brand text-white overflow-hidden py-16 lg:py-24">
            <!-- Background Subtle Patterns -->
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            <div class="absolute -top-24 -right-24 w-96 h-96 bg-academicRed-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                <div class="grid lg:grid-cols-12 gap-12 items-center">
                    
                    <!-- Left Hero Content -->
                    <div class="lg:col-span-7 text-center lg:text-left space-y-6">
                       
                        
                        <h3 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                            Thank you for visiting <span class="text-academicRed-500 underline decoration-white/30">St. Monica Memorial</span>
                        </h3>
                        
                        <h2 class="text-slate-200 text-base sm:text-lg max-w-2xl mx-auto lg:mx-0 font-normal leading-relaxed">
                            We are currently transferring the website to the main domain. Stay tuned.
                        </h2>


                </div>
            </div>
        </section>
    </main>

    <!-- Custom Interactive Logic & Modal Management -->
    <script>
        // Set dynamic copyright year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Toggle Mobile Navigation Menu
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                menu.classList.add('hidden');
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        }

        // Open Admission Modal
        function openAdmissionModal(defaultGrade = 'Daycare') {
            const modal = document.getElementById('admission-modal');
            const select = document.getElementById('modalGradeSelect');
            if (select) {
                select.value = defaultGrade;
            }
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close Admission Modal
        function closeAdmissionModal() {
            const modal = document.getElementById('admission-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Handle Admission Form Submission & Direct WhatsApp Pre-fill
        function handleAdmissionSubmit(event) {
            event.preventDefault();
            
            const parentName = document.getElementById('parentName').value;
            const parentPhone = document.getElementById('parentPhone').value;
            const childName = document.getElementById('childName').value;
            const grade = document.getElementById('modalGradeSelect').value;
            const startDate = document.getElementById('startDate').value || 'As soon as possible';
            const location = document.getElementById('locationArea').value || 'Not specified';
            const notes = document.getElementById('notes').value || 'None';

            // Construct structured WhatsApp booking message
            const message = `Hello St. Monica Memorial School!%0A%0A*NEW ADMISSION BOOKING*%0A--------------------------------%0A*Parent Name:* ${encodeURIComponent(parentName)}%0A*Phone:* ${encodeURIComponent(parentPhone)}%0A*Child Name:* ${encodeURIComponent(childName)}%0A*Grade Interested:* ${encodeURIComponent(grade)}%0A*Expected Start Date:* ${encodeURIComponent(startDate)}%0A*Location:* ${encodeURIComponent(location)}%0A*Notes:* ${encodeURIComponent(notes)}%0A--------------------------------%0APlease guide me on the next admission steps.`;

            // Redirect to WhatsApp
            const whatsappUrl = `https://wa.me/254712674922?text=${message}`;
            
            // Close modal and open WhatsApp window
            closeAdmissionModal();
            window.open(whatsappUrl, '_blank');
        }

        // Quick WhatsApp Inquiry from Calculator Tool
        function sendQuickWhatsAppInquiry() {
            const grade = document.getElementById('calc-grade').value;
            const transport = document.getElementById('calc-transport').value;
            const term = document.getElementById('calc-term').value;

            const msg = `Hello St. Monica School, I would like to inquire about fee structure and admission for *${grade.toUpperCase()}* (${term.toUpperCase()}) with transport option: *${transport}*. Please share details.`;
            window.open(`https://wa.me/254712674922?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // Dynamic update for calculation helper
        function calculateInquiry() {
            const resultDiv = document.getElementById('calc-result');
            // Flash effect for feedback
            resultDiv.classList.add('opacity-80');
            setTimeout(() => resultDiv.classList.remove('opacity-80'), 200);
        }

        // Close modal when clicking on backdrop
        window.onclick = function(event) {
            const modal = document.getElementById('admission-modal');
            if (event.target === modal) {
                closeAdmissionModal();
            }
        }
    </script>
</body>
</html>
